# Offline golden conformance and defensive security audit for OnlyBlocks.
#
# Everything here runs on loopback against conformance/mock_old_faithful.py.
# No job talks to files.old-faithful.net; the live mainnet probes stay a
# manual `make live` / `make bench`.
#
# Most launchers target macOS on Apple Silicon (system Ruby and Perl,
# hand-written AArch64 assembly, Homebrew paths), so implementations run on
# an arm64 macOS runner, one matrix job each. Each job installs only the
# toolchain its build.sh and run.sh name.
#
# experimental: true marks entries whose CI toolchain differs from the one
# the repository was benchmarked with (a newer Homebrew compiler, the runner's
# Xcode Swift, a Homebrew bash with loadables). They report but do not fail
# the workflow.
#
# Not in CI: zig, whose build.sh provisions the compiler with
# `nix shell nixpkgs#zig --offline` only.

name: conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: harness self-test
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Compile the harness
        run: python3 -m py_compile conformance/*.py
      - name: Self-test the runner and mock origin
        run: python3 conformance/runner.py --self-test

  implementation:
    name: ${{ matrix.impl }}
    needs: harness
    runs-on: macos-15
    timeout-minutes: 30
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Xcode clang and the macOS SDK's libcurl.
          - {impl: arm64-asm, experimental: false}
          - {impl: c, experimental: false}
          - {impl: cpp, experimental: false}
          # The runner's rustup toolchain; Cargo.toml has no dependencies.
          - {impl: rust, experimental: false}
          # Official setup actions, pinned to the benchmarked versions.
          - {impl: go, experimental: false}
          - {impl: python, experimental: false}
          - {impl: javascript-node, experimental: false}
          - {impl: typescript-deno, experimental: false}
          - {impl: bun, experimental: false}
          - {impl: java, experimental: false}
          - {impl: csharp, experimental: false}
          # macOS system interpreters (/usr/bin/perl, /usr/bin/ruby 2.6).
          - {impl: perl, experimental: false}
          - {impl: ruby, experimental: false}
          # Homebrew formulae at the major versions the READMEs name.
          - {impl: tcl, experimental: false}
          - {impl: php, experimental: false}
          - {impl: ocaml, experimental: false}
          # Toolchain differs from the benchmarked one, or (erlang@26) comes
          # from a deprecated Homebrew formula that may be disabled.
          - {impl: erlang, experimental: true}
          - {impl: kotlin, experimental: true}
          - {impl: elixir, experimental: true}
          - {impl: fortran, experimental: true}
          - {impl: haskell, experimental: true}
          - {impl: swift, experimental: true}
          - {impl: bash-awk, experimental: true}
    steps:
      - uses: actions/checkout@v5

      # The harness itself, and impls/python/run.sh's `python3.11`.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - if: matrix.impl == 'go'
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false

      - if: matrix.impl == 'javascript-node'
        uses: actions/setup-node@v6
        with:
          node-version: "25"

      - if: matrix.impl == 'typescript-deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.6.3"

      - if: matrix.impl == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - if: matrix.impl == 'java' || matrix.impl == 'kotlin'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - if: matrix.impl == 'csharp'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Install the Homebrew toolchain
        if: contains(fromJSON('["tcl","php","erlang","ocaml","kotlin","elixir","fortran","haskell","bash-awk"]'), matrix.impl)
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          case "${{ matrix.impl }}" in
            tcl)      brew install tcl-tk ;;
            php)      brew install php ;;
            erlang)   brew install erlang@26
                      echo "$(brew --prefix erlang@26)/bin" >> "$GITHUB_PATH" ;;
            ocaml)    brew install ocaml ;;
            kotlin)   brew install kotlin ;;
            elixir)   brew install elixir ;;
            fortran)  brew install gcc ;;
            haskell)  brew install ghc ;;
            bash-awk) brew install bash ;;
          esac

      # The setup-* actions append to PATH, but conformance/runner.py puts
      # ~/.cargo/bin, ~/.nix-profile/bin and /opt/homebrew/bin first. Unlink
      # any Homebrew copy that would shadow the pinned version.
      - name: Keep Homebrew from shadowing the pinned toolchain
        if: contains(fromJSON('["go","javascript-node","typescript-deno","bun"]'), matrix.impl)
        run: |
          for formula in go node deno bun; do
            if brew list --formula "$formula" >/dev/null 2>&1; then
              brew unlink "$formula"
            fi
          done

      - name: Check the toolchain the harness will run
        run: |
          # The same PATH order as child_env() in conformance/runner.py.
          export PATH="$HOME/.cargo/bin:$HOME/.nix-profile/bin:/opt/homebrew/bin:$PATH"
          want() {  # want <regex> <command...>: print its first line, fail on a mismatch
            local pattern=$1; shift
            local out; out=$("$@" 2>&1 | head -n 1)
            echo "$* -> $out"
            grep -Eq "$pattern" <<<"$out" || { echo "::error::expected /$pattern/ from: $*"; exit 1; }
          }
          uname -mrs
          want '^Python 3\.11\.' python3.11 --version
          case "${{ matrix.impl }}" in
            arm64-asm|c|cpp) want 'clang version' clang --version ;;
            rust)            want '^cargo ' cargo --version ;;
            go)              want 'go1\.25\.' go version ;;
            javascript-node) want '^v25\.' node --version ;;
            typescript-deno) want '^deno 2\.6\.' deno --version ;;
            bun)             want '^1\.4\.' bun --version ;;
            java)            PATH="/opt/homebrew/opt/openjdk@17/bin:$PATH" want '"(1[7-9]|[2-9][0-9])\.' java -version ;;
            kotlin)          want 'kotlinc-jvm' kotlinc -version ;;
            csharp)          want '^8\.' sh -c 'dotnet --list-sdks | grep -m1 "^8\."' ;;
            perl)            want '^v5\.' /usr/bin/perl -e 'print "$^V\n"' ;;
            ruby)            want '^ruby 2\.6\.' /usr/bin/ruby --version ;;
            tcl)             want '^9\.' /opt/homebrew/bin/tclsh <<<'puts [info patchlevel]' ;;
            php)             want '^PHP 8\.' php --version ;;
            erlang)          want '^OTP 26' erl -noshell -eval 'io:format("OTP ~s~n",[erlang:system_info(otp_release)]),halt().' ;;
            elixir)          want '^Elixir ' sh -c 'elixir --version | grep "^Elixir"' ;;
            ocaml)           want '^5\.' ocamlopt -version ;;
            fortran)         want 'GNU Fortran' /opt/homebrew/bin/gfortran --version ;;
            haskell)         want 'Glasgow Haskell' ghc --version ;;
            swift)           want 'Swift version 6\.' /usr/bin/swiftc --version ;;
            bash-awk)        want '^GNU bash, version 5\.3' bash --version
                             want '/accept$' ls "$(brew --prefix bash)/lib/bash/accept"
                             want '^awk version' awk --version ;;
          esac

      - name: Golden conformance (offline)
        run: python3 conformance/runner.py --impl "${{ matrix.impl }}"

      - name: Defensive security audit (loopback)
        run: python3 conformance/security_audit.py --impl "${{ matrix.impl }}" --skip-build
