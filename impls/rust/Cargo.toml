[package]
name = "onlyblocks"
version = "0.1.0"
edition = "2021"
description = "OnlyBlocks: a zero-crate, pure-std historical Solana getBlock JSON-RPC server backed by Old Faithful HTTP Range reads"
publish = false

# Zero third-party crates: everything (HTTP, JSON, CAR, DAG-CBOR, protobuf, bincode,
# zstd, Base58/64, LRU caches) is implemented on top of Rust `std` in `src/`.
[dependencies]

[dev-dependencies]

[profile.release]
opt-level = 3
codegen-units = 4
debug = false
# Panics must unwind so a hostile archive byte becomes a -32603, never a crash.
panic = "unwind"
